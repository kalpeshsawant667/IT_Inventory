<style>

    --bg:#0B0F14;
    --panel:#121822;
    --panel-alt:#182130;
    --border:#26313F;
    --text:#E7ECF3;
    --text-dim:#8B96A6;
    --text-faint:#5C6779;
    --accent:#22E6AC;
    --accent-dim:#15A67D;
    --accent-glow:rgba(34,230,172,0.14);
    --warn:#F5A93E;
    --warn-glow:rgba(245,169,62,0.14);
    --danger:#F16368;
    --danger-glow:rgba(241,99,104,0.14);
    --info:#5B93FF;
    --info-glow:rgba(91,147,255,0.14);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100%;}
  #root{display:flex;min-height:100vh;}
  ::selection{background:var(--accent-glow);color:var(--accent);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}

  h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---- Sidebar ---- */
  #sidebar{
    width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .brand{padding:22px 20px 18px;border-bottom:1px solid var(--border);}
  .brand-mark{display:flex;align-items:center;gap:10px;}
  .brand-ticks{display:flex;gap:2px;align-items:flex-end;height:18px;}
  .brand-ticks span{width:3px;background:var(--accent);display:inline-block;}
  .brand-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:0.02em;}
  .brand-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);margin-top:4px;letter-spacing:0.08em;text-transform:uppercase;}

  nav.navlist{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;
    color:var(--text-dim);font-size:13.5px;font-weight:500;transition:background .12s,color .12s;user-select:none;
  }
  .navitem:hover{background:var(--panel-alt);color:var(--text);}
  .navitem.active{background:var(--accent-glow);color:var(--accent);}
  .navitem svg{flex:0 0 16px;}
  .nav-badge{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);background:var(--panel-alt);padding:1px 6px;border-radius:20px;}
  .navitem.active .nav-badge{color:var(--accent);}

  .sidebar-foot{padding:14px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}

  /* ---- Main ---- */
  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  #topbar{
    display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:rgba(11,15,20,0.9);backdrop-filter:blur(6px);z-index:5;
  }
  .searchbox{
    flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text-dim);
  }
  .searchbox input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:'Inter',sans-serif;}
  .topbar-spacer{flex:1;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;
    cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);transition:all .12s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--text-faint);}
  .btn-primary{background:var(--accent);color:#06231A;border-color:var(--accent);}
  .btn-primary:hover{background:#3EF2C0;border-color:#3EF2C0;}
  .btn-danger{color:var(--danger);}
  .btn-danger:hover{border-color:var(--danger);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--panel-alt);}
  .btn-sm{padding:5px 10px;font-size:12px;}

  .view-title p{color:var(--text-dim);font-size:13px;margin:4px 0 0;}

  .kpi .value{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;margin-top:6px;}
  .kpi .sub{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .kpi .accentbar{position:absolute;left:0;top:0;bottom:0;width:3px;}

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media (max-width:980px){.grid-2{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
  .panel h3{font-size:14px;margin:0 0 14px;color:var(--text);}
  .panel h3 .count{color:var(--text-faint);font-weight:400;font-family:'JetBrains Mono',monospace;font-size:12px;}

  .barrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}

  .barrow .bartrack{flex:1;height:10px;background:var(--panel-alt);border-radius:5px;overflow:hidden;}
  .barrow .barfill{height:100%;border-radius:5px;}
  .barrow .barval{width:34px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);}

  .activity-item .t{color:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:10.5px;white-space:nowrap;}

  .expiry-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .expiry-item:last-child{border-bottom:none;}

  /* ---- Table ---- */

  table{width:100%;border-collapse:collapse;font-size:13px;}

    padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;background:var(--panel-alt);}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;transition:background .1s;}
  tbody tr:hover{background:var(--panel-alt);}
  .empty-row td{text-align:center;color:var(--text-faint);padding:40px;cursor:default;}
  .empty-row:hover{background:transparent;}

  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  select, .input{

  .detail-row .v{color:var(--text);font-weight:500;text-align:right;}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-faint);font-weight:700;margin:18px 0 8px;}
  .barcode-visual{display:flex;align-items:center;gap:1.5px;height:36px;margin:14px 0;padding:8px 10px;background:#0E141C;border:1px solid var(--border);border-radius:6px;width:fit-content;}
  .barcode-visual span{background:var(--accent);display:inline-block;height:100%;}

  .toast-wrap{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:100;}
  .toast{background:var(--panel-alt);border:1px solid var(--border);border-left:3px solid var(--accent);color:var(--text);
    padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.35);animation:slidein .18s ease-out;min-width:220px;}
  .toast.danger{border-left-color:var(--danger);}
  @keyframes slidein{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
  .empty-state h3{color:var(--text-dim);font-size:15px;margin-bottom:6px;}

  .spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;}

  .subtabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .subtab{padding:9px 4px;margin-right:18px;font-size:13px;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;font-weight:500;}
  .subtab.active{color:var(--text);border-bottom-color:var(--accent);}

  .list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}

  .conf-box{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--text-dim);margin-bottom:14px;}
</style>

  function logActivity(text){
    state.activity.unshift({ts:new Date().toISOString(), text:text});
    if(state.activity.length>40) state.activity.length = 40;
  }

  async function loadState(){
    try{
      var res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){ state = JSON.parse(res.value); return; }
    }catch(e){ /* not found or error -> seed */ }
    state = seedData();
    await saveState();
  }

  var saveTimer = null;
  function saveState(){
    return new Promise(function(resolve){
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async function(){
        try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
        catch(e){ console.error("Save failed", e); toast("Couldn't save changes. Retrying…", true); }
        resolve();
      }, 150);
    });
  }

  function toast(msg, danger){
    var id = uid("t");
    ui.toasts.push({id:id, msg:msg, danger:!!danger});
    render();
    setTimeout(function(){
      ui.toasts = ui.toasts.filter(function(t){return t.id!==id;});
      render();
    }, 3200);
  }

  /* ---------------- Derived data helpers ---------------- */
  function getUser(id){ return state.users.find(function(u){return u.id===id;}); }
  function getAsset(id){ return state.assets.find(function(a){return a.id===id;}); }
  function activeAssignmentFor(assetId){ return state.assignments.find(function(x){return x.assetId===assetId && x.status==="Active";}); }

  function filteredAssets(){
    var q = ui.search.trim().toLowerCase();
    return state.assets.filter(function(a){
      if(ui.assetFilters.status && a.status!==ui.assetFilters.status) return false;
      if(ui.assetFilters.category && a.category!==ui.assetFilters.category) return false;
      if(ui.assetFilters.location && a.location!==ui.assetFilters.location) return false;
      if(!q) return true;
      return (a.name+" "+a.tag+" "+a.serialNumber+" "+a.manufacturer+" "+a.model).toLowerCase().indexOf(q) !== -1;
    });
  }

  function upcomingExpiries(days){
    return state.assets.filter(function(a){
      var d = daysUntil(a.warrantyExpiry);
      return d!==null && d<=days;
    }).sort(function(a,b){ return daysUntil(a.warrantyExpiry)-daysUntil(b.warrantyExpiry); });
  }

  /* ---------------- Rendering ---------------- */
  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

  function barcodeTicks(seedStr, n){
    var out = "";
    var seed = 0; for(var i=0;i<seedStr.length;i++) seed += seedStr.charCodeAt(i);
    for(var i2=0;i2<n;i2++){
      var w = ((seed*(i2+3)) % 3) + 1;
      out += '<span style="width:'+w+'px"></span>';
    }
    return out;
  }

  function tagChip(tag){
    return '<span class="tag-chip"><span class="ticks">'+barcodeTicks(tag,5)+'</span><span class="val">'+escapeHtml(tag)+'</span></span>';
  }

  function pill(status){
    return '<span class="pill '+statusClass(status)+'"><span class="dot"></span>'+status+'</span>';
  }

    var byStatus = {}; STATUS_LIST.forEach(function(s){byStatus[s]=0;});

    var byCat = {};
    state.assets.forEach(function(a){ byCat[a.category] = (byCat[a.category]||0)+1; });
    var maxCat = Math.max.apply(null, Object.values(byCat).concat([1]));

    var totalValue = state.assets.reduce(function(sum,a){ return sum + (Number(a.cost)||0); }, 0);
    var expiring30 = upcomingExpiries(30).length;
    var activeAssignments = state.assignments.filter(function(a){return a.status==="Active";}).length;

    var kpis = [
      {label:"Total Assets", value: state.assets.length, sub: state.categories.length+" categories", color:"var(--accent)"},
      {label:"Available", value: byStatus["Available"], sub: "ready to deploy", color:"var(--accent)"},
      {label:"Assigned", value: byStatus["Assigned"], sub: activeAssignments+" active checkouts", color:"var(--info)"},
      {label:"In Repair", value: byStatus["In Repair"], sub: state.maintenance.filter(function(m){return m.status==="Scheduled";}).length+" open work orders", color:"var(--warn)"},
      {label:"Warranty Expiring", value: expiring30, sub: "within 30 days", color: expiring30>0 ? "var(--danger)" : "var(--accent)"},
      {label:"Fleet Value", value: "$"+Math.round(totalValue/1000)+"k", sub: "purchase cost total", color:"var(--accent)"}
    ];

    return '<div class="view-title"><div><h1>Dashboard</h1><p>Live snapshot of your IT asset fleet.</p></div></div>'+
      '<div class="kpi-grid">'+ kpis.map(function(k){
        return '<div class="kpi"><div class="accentbar" style="background:'+k.color+'"></div>'+
          '<div class="label">'+k.label+'</div><div class="value">'+k.value+'</div><div class="sub">'+k.sub+'</div></div>';
      }).join('') +'</div>'+
      '<div class="grid-2">'+
        '<div class="panel"><h3>Assets by Status</h3>'+
          STATUS_LIST.map(function(s){
            var v = byStatus[s]||0;
            return '<div class="barrow"><div class="barlabel">'+s+'</div><div class="bartrack"><div class="barfill" style="width:'+(v/maxStatus*100)+'%;background:'+statusColor(s)+'"></div></div><div class="barval">'+v+'</div></div>';
          }).join('') +
          '<div class="section-label" style="margin-top:22px;">By Category</div>'+
          Object.keys(byCat).map(function(c){
            var v = byCat[c];
            return '<div class="barrow"><div class="barlabel">'+c+'</div><div class="bartrack"><div class="barfill" style="width:'+(v/maxCat*100)+'%;background:var(--accent-dim)"></div></div><div class="barval">'+v+'</div></div>';
          }).join('') +
        '</div>'+
        '<div>'+
          '<div class="panel" style="margin-bottom:16px;"><h3>Warranty Watch <span class="count">next 30 days</span></h3>'+
            (upcomingExpiries(30).length===0 ? '<div style="color:var(--text-faint);font-size:12.5px;">Nothing expiring soon. All clear.</div>' :
              upcomingExpiries(30).slice(0,6).map(function(a){
                var d = daysUntil(a.warrantyExpiry);
                var col = d<0 ? "var(--danger)" : (d<=7 ? "var(--warn)" : "var(--text-dim)");
                return '<div class="expiry-item"><span>'+escapeHtml(a.name)+'</span><span class="mono" style="color:'+col+'">'+(d<0 ? Math.abs(d)+"d overdue" : d+"d left")+'</span></div>';
              }).join('')) +
          '</div>'+
          '<div class="panel"><h3>Recent Activity</h3>'+
            state.activity.slice(0,8).map(function(a){
              return '<div class="activity-item"><div class="activity-dot"></div><div><div>'+escapeHtml(a.text)+'</div><div class="t">'+fmtDate(a.ts)+'</div></div></div>';
            }).join('') +

      '</div>';

        }).join('')+'</tbody></table></div>';
    } else if(ui.reportsTab==="warranty"){
      var exp = upcomingExpiries(9999).sort(function(a,b){return new Date(a.warrantyExpiry)-new Date(b.warrantyExpiry);});
      body = '<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Tag</th><th>Location</th><th>Warranty Expiry</th><th>Status</th></tr></thead><tbody>'+
        (exp.length===0 ? '<tr class="empty-row"><td colspan="5">No warranty data.</td></tr>' :
        exp.map(function(a){
          var d = daysUntil(a.warrantyExpiry);
          var col = d<0 ? "var(--danger)" : d<=30 ? "var(--warn)" : "var(--text-dim)";
          return '<tr><td>'+escapeHtml(a.name)+'</td><td>'+tagChip(a.tag)+'</td><td>'+escapeHtml(a.location)+'</td><td class="mono" style="color:'+col+'">'+fmtDate(a.warrantyExpiry)+' ('+(d<0?Math.abs(d)+'d overdue':d+'d left')+')</td><td>'+pill(a.status)+'</td></tr>';
        }).join(''))+'</tbody></table></div>';
    } else {
      var totalCost = state.assets.reduce(function(s,a){return s+(Number(a.cost)||0);},0);
      body = '<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Tag</th><th>Purchase Date</th><th>Cost</th><th>Age</th></tr></thead><tbody>'+
        state.assets.map(function(a){
          var years = a.purchaseDate ? ((new Date()-new Date(a.purchaseDate))/(365*86400000)).toFixed(1) : "—";
          return '<tr><td>'+escapeHtml(a.name)+'</td><td>'+tagChip(a.tag)+'</td><td class="mono" style="font-size:12px;">'+fmtDate(a.purchaseDate)+'</td><td class="mono">'+fmtMoney(a.cost)+'</td><td class="mono">'+years+' yrs</td></tr>';
        }).join('')+'</tbody></table></div>'+
        '<div class="conf-box" style="margin-top:14px;">Total purchase cost across fleet: <strong class="mono">'+fmtMoney(totalCost)+'</strong></div>';
    }
    return '<div class="view-title"><div><h1>Reports</h1><p>Export-ready views of your inventory data.</p></div>'+
      '<button class="btn" id="export-csv">Export CSV</button></div>'+
      '<div class="subtabs">'+tabs.map(function(t){return '<div class="subtab '+(ui.reportsTab===t.id?'active':'')+'" data-rtab="'+t.id+'">'+t.label+'</div>';}).join('')+'</div>'+
      body;
  }

          '<div style="display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;">'+

            (a.status==="Assigned" ? '<button class="btn btn-sm" data-quick-return="'+a.id+'">Check In</button>' : '')+
            (a.status!=="In Repair" && a.status!=="Retired" && a.status!=="Disposed" ? '<button class="btn btn-sm" data-set-status="'+a.id+'|In Repair">Send to Repair</button>' : '')+
            (a.status!=="Retired" ? '<button class="btn btn-sm" data-set-status="'+a.id+'|Retired">Retire</button>' : '')+

  /* ---------------- Modals ---------------- */
  function modalWrap(title, bodyHtml, footHtml){
    return '<div class="overlay" data-close-modal-bg="1"><div class="modal">'+
      '<div class="modal-head"><h3>'+title+'</h3><div class="close-x" data-close-modal="1">'+ICONS.close+'</div></div>'+
      '<div class="modal-body">'+bodyHtml+'</div>'+
      '<div class="modal-foot">'+footHtml+'</div>'+
    '</div></div>';
  }

      '<div class="field-row"><div class="field"><label>Manufacturer</label><input id="f-manufacturer" value="'+escapeHtml(a.manufacturer)+'"/></div>'+
      '<div class="field"><label>Model</label><input id="f-model" value="'+escapeHtml(a.model)+'"/></div></div>'+
      '<div class="field"><label>Serial Number</label><input id="f-serial" class="mono" value="'+escapeHtml(a.serialNumber)+'"/></div>'+
      '<div class="field-row"><div class="field"><label>Category</label><select id="f-category">'+state.categories.map(function(c){return '<option '+(c.name===a.category?'selected':'')+'>'+escapeHtml(c.name)+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label>Location</label><select id="f-location">'+state.locations.map(function(l){return '<option '+(l.name===a.location?'selected':'')+'>'+escapeHtml(l.name)+'</option>';}).join('')+'</select></div></div>'+
      '<div class="field-row"><div class="field"><label>Purchase Date</label><input type="date" id="f-purchase" value="'+(a.purchaseDate||'')+'"/></div>'+
      '<div class="field"><label>Warranty Expiry</label><input type="date" id="f-warranty" value="'+(a.warrantyExpiry||'')+'"/></div></div>'+
      '<div class="field-row"><div class="field"><label>Purchase Cost (USD)</label><input type="number" step="0.01" id="f-cost" value="'+(a.cost!==undefined?a.cost:'')+'"/></div>'+
      '<div class="field"><label>Vendor</label><input id="f-vendor" value="'+escapeHtml(a.vendor||'')+'"/></div></div>'+
      '<div class="field"><label>Notes</label><textarea id="f-notes">'+escapeHtml(a.notes||'')+'</textarea></div>',

  function modalAssignment(){
    var available = state.assets.filter(function(a){return a.status==="Available";});
    return modalWrap("New Checkout",
      (available.length===0 ? '<div class="conf-box">No available assets to check out right now.</div>' :
      '<div class="field"><label>Asset</label><select id="f-asset">'+available.map(function(a){return '<option value="'+a.id+'">'+escapeHtml(a.name)+' — '+escapeHtml(a.tag)+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label>Assign To</label><select id="f-user">'+state.users.map(function(u){return '<option value="'+u.id+'">'+escapeHtml(u.name)+' ('+escapeHtml(u.department)+')</option>';}).join('')+'</select></div>'+
      '<div class="field-row"><div class="field"><label>Checkout Date</label><input type="date" id="f-adate" value="'+new Date().toISOString().slice(0,10)+'"/></div>'+
      '<div class="field"><label>Expected Return</label><input type="date" id="f-rdate"/></div></div>'+
      '<div class="field"><label>Notes</label><textarea id="f-anotes" placeholder="Optional"></textarea></div>'),
      '<button class="btn btn-ghost" data-close-modal="1">Cancel</button>'+
      (available.length>0 ? '<button class="btn btn-primary" id="save-assignment">Check Out</button>' : '')
    );
  }

  function modalMaintenance(){
    return modalWrap("New Work Order",
      '<div class="field"><label>Asset</label><select id="f-masset">'+state.assets.map(function(a){return '<option value="'+a.id+'">'+escapeHtml(a.name)+' — '+escapeHtml(a.tag)+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label>Type</label><select id="f-mtype"><option>Repair</option><option>Preventive</option><option>Inspection</option></select></div>'+
      '<div class="field"><label>Description</label><textarea id="f-mdesc" placeholder="What needs to be done?"></textarea></div>'+
      '<div class="field"><label>Scheduled Date</label><input type="date" id="f-mdate" value="'+new Date().toISOString().slice(0,10)+'"/></div>',
      '<button class="btn btn-ghost" data-close-modal="1">Cancel</button>'+
      '<button class="btn btn-primary" id="save-maintenance">Create Work Order</button>'
    );

  function modalConfirm(){
    var m = ui.modal;
    return modalWrap(m.title, '<div class="conf-box">'+m.message+'</div>',
      '<button class="btn btn-ghost" data-close-modal="1">Cancel</button>'+
      '<button class="btn btn-danger" id="confirm-yes">'+m.confirmLabel+'</button>'
    );
  }

  function renderModal(){
    if(!ui.modal) return "";
    if(ui.modal.type==="asset") return modalAsset();
    if(ui.modal.type==="assignment") return modalAssignment();
    if(ui.modal.type==="maintenance") return modalMaintenance();
    if(ui.modal.type==="confirm") return modalConfirm();
    return "";
  }

  function renderToasts(){
    return '<div class="toast-wrap">'+ui.toasts.map(function(t){
      return '<div class="toast '+(t.danger?'danger':'')+'">'+escapeHtml(t.msg)+'</div>';
    }).join('')+'</div>';
  }

  function currentViewHtml(){
    if(ui.view==="dashboard") return viewDashboard();
    if(ui.view==="assets") return viewAssets();
    if(ui.view==="assignments") return viewAssignments();
    if(ui.view==="maintenance") return viewMaintenance();
    if(ui.view==="reports") return viewReports();
    if(ui.view==="settings") return viewSettings();
    return "";
  }

  function render(){
    var root = document.getElementById("root");
    root.innerHTML = sidebar() +
      '<div id="main">' + topbar() + '<div id="content">' + currentViewHtml() + '</div></div>' +
      assetDrawer() + renderModal() + renderToasts();
    bindEvents();
    var searchInput = document.getElementById("global-search");
    if(searchInput){
      searchInput.focus();
      var val = searchInput.value; searchInput.value=""; searchInput.value = val;
    }
  }

  /* ---------------- Actions ---------------- */
  function openModal(type, opts){ ui.modal = Object.assign({type:type}, opts||{}); render(); }
  function closeModal(){ ui.modal = null; render(); }

  function createOrUpdateAsset(){
    var name = document.getElementById("f-name").value.trim();
    var tag = document.getElementById("f-tag").value.trim();
    if(!name || !tag){ toast("Asset name and tag are required.", true); return; }
    var data = {
      name:name, tag:tag,
      manufacturer:document.getElementById("f-manufacturer").value.trim(),
      model:document.getElementById("f-model").value.trim(),
      serialNumber:document.getElementById("f-serial").value.trim(),
      category:document.getElementById("f-category").value,
      location:document.getElementById("f-location").value,
      purchaseDate:document.getElementById("f-purchase").value,
      warrantyExpiry:document.getElementById("f-warranty").value,
      cost:document.getElementById("f-cost").value,
      vendor:document.getElementById("f-vendor").value.trim(),
      notes:document.getElementById("f-notes").value.trim()
    };
    if(ui.modal.editId){
      var a = getAsset(ui.modal.editId);
      Object.assign(a, data);
      a.history.push({ts:new Date().toISOString(), text:"Asset details updated"});
      logActivity("Updated asset "+a.name);
      toast("Asset updated.");
    } else {
      var newAsset = Object.assign({id:uid("a"), status:"Available", assignedTo:null, history:[{ts:new Date().toISOString(), text:"Asset registered"}]}, data);
      state.assets.unshift(newAsset);
      logActivity("Registered new asset "+newAsset.name);
      toast("Asset created.");
    }
    saveState();
    closeModal();
  }

  function createAssignment(){
    var assetId = document.getElementById("f-asset").value;
    var userId = document.getElementById("f-user").value;
    var adate = document.getElementById("f-adate").value;
    var rdate = document.getElementById("f-rdate").value;
    var notes = document.getElementById("f-anotes").value.trim();
    var asset = getAsset(assetId); var user = getUser(userId);
    if(!asset || !user){ toast("Select an asset and a user.", true); return; }
    state.assignments.unshift({id:uid("as"), assetId:assetId, userId:userId, assignedDate:adate, expectedReturn:rdate||null, actualReturn:null, status:"Active", notes:notes});
    asset.status = "Assigned"; asset.assignedTo = userId;
    asset.history.push({ts:new Date().toISOString(), text:"Assigned to "+user.name});
    logActivity(asset.name+" checked out to "+user.name);
    toast("Asset checked out to "+user.name+".");
    saveState(); closeModal();
  }

  function checkInAssignment(assignId){
    var as = state.assignments.find(function(x){return x.id===assignId;});
    if(!as) return;
    as.status = "Returned"; as.actualReturn = new Date().toISOString().slice(0,10);
    var asset = getAsset(as.assetId);
    if(asset){ asset.status="Available"; asset.assignedTo=null; asset.history.push({ts:new Date().toISOString(), text:"Checked in — now available"}); logActivity(asset.name+" checked in"); }
    toast("Asset checked in.");
    saveState(); render();
  }

  function createMaintenance(){
    var assetId = document.getElementById("f-masset").value;
    var type = document.getElementById("f-mtype").value;
    var desc = document.getElementById("f-mdesc").value.trim();
    var date = document.getElementById("f-mdate").value;
    var asset = getAsset(assetId);
    if(!asset || !desc){ toast("Please fill in the description.", true); return; }
    state.maintenance.unshift({id:uid("m"), assetId:assetId, type:type, description:desc, scheduledDate:date, completedDate:null, status:"Scheduled", cost:null});
    asset.history.push({ts:new Date().toISOString(), text:type+" work order created"});
    logActivity(type+" work order created for "+asset.name);
    toast("Work order created.");
    saveState(); closeModal();
  }

  function completeMaintenance(id){
    var m = state.maintenance.find(function(x){return x.id===id;});
    if(!m) return;
    m.status = "Completed"; m.completedDate = new Date().toISOString().slice(0,10);
    logActivity("Maintenance completed for "+(getAsset(m.assetId)||{}).name);
    toast("Work order marked complete.");
    saveState(); render();
  }

  function setAssetStatus(assetId, status){
    var a = getAsset(assetId);
    if(!a) return;
    a.status = status;
    if(status!=="Assigned"){
      var act = activeAssignmentFor(assetId);
      if(act){ act.status="Returned"; act.actualReturn=new Date().toISOString().slice(0,10); }
      a.assignedTo=null;
    }
    a.history.push({ts:new Date().toISOString(), text:"Status changed to "+status});
    logActivity(a.name+" marked "+status);
    toast(a.name+" marked "+status+".");
    saveState(); render();
  }

  function deleteAsset(assetId){
    var a = getAsset(assetId);
    state.assets = state.assets.filter(function(x){return x.id!==assetId;});
    state.assignments = state.assignments.filter(function(x){return x.assetId!==assetId;});
    state.maintenance = state.maintenance.filter(function(x){return x.assetId!==assetId;});
    logActivity("Deleted asset "+(a?a.name:""));
    toast("Asset deleted.", true);
    ui.drawerAssetId = null;
    saveState(); render();
  }

  function exportCsv(){
    var rows = [["Tag","Name","Category","Manufacturer","Model","Serial","Location","Status","Assigned To","Purchase Date","Warranty Expiry","Cost"]];
    state.assets.forEach(function(a){
      var u = a.assignedTo ? getUser(a.assignedTo) : null;
      rows.push([a.tag,a.name,a.category,a.manufacturer,a.model,a.serialNumber,a.location,a.status,u?u.name:"",a.purchaseDate,a.warrantyExpiry,a.cost]);
    });
    var csv = rows.map(function(r){ return r.map(function(c){ return '"'+String(c==null?"":c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
    var blob = new Blob([csv], {type:"text/csv"});
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url; link.download = "asset-inventory-export.csv";
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    URL.revokeObjectURL(url);
    toast("CSV export downloaded.");
  }

  /* ---------------- Event binding ---------------- */
  function bindEvents(){
    document.querySelectorAll("[data-nav]").forEach(function(elm){
      elm.onclick = function(){ ui.view = elm.getAttribute("data-nav"); ui.drawerAssetId=null; render(); };
    });
    var gs = document.getElementById("global-search");
    if(gs) gs.oninput = function(){ ui.search = gs.value; if(ui.view!=="assets") ui.view="assets"; render(); };

    document.querySelectorAll("[data-open-modal]").forEach(function(elm){
      elm.onclick = function(){ openModal(elm.getAttribute("data-open-modal")); };
    });
    document.querySelectorAll("[data-close-modal],[data-close-modal-bg]").forEach(function(elm){
      elm.onclick = function(e){ if(e.target===elm) closeModal(); };
    });

    document.querySelectorAll("[data-open-drawer]").forEach(function(elm){
      elm.onclick = function(){ ui.drawerAssetId = elm.getAttribute("data-open-drawer"); render(); };
    });
    document.querySelectorAll("[data-close-drawer]").forEach(function(elm){
      elm.onclick = function(e){ if(e.target===elm){ ui.drawerAssetId=null; render(); } };
    });

    var saveAssetBtn = document.getElementById("save-asset");
    if(saveAssetBtn) saveAssetBtn.onclick = createOrUpdateAsset;
    var saveAssignBtn = document.getElementById("save-assignment");
    if(saveAssignBtn) saveAssignBtn.onclick = createAssignment;
    var saveMaintBtn = document.getElementById("save-maintenance");
    if(saveMaintBtn) saveMaintBtn.onclick = createMaintenance;

    document.querySelectorAll("[data-checkin]").forEach(function(elm){
      elm.onclick = function(){ checkInAssignment(elm.getAttribute("data-checkin")); };
    });
    document.querySelectorAll("[data-complete-maint]").forEach(function(elm){
      elm.onclick = function(){ completeMaintenance(elm.getAttribute("data-complete-maint")); };
    });

    document.querySelectorAll("[data-edit-asset]").forEach(function(elm){
      elm.onclick = function(){ openModal("asset", {editId: elm.getAttribute("data-edit-asset")}); };
    });
    document.querySelectorAll("[data-quick-assign]").forEach(function(elm){
      elm.onclick = function(){ openModal("assignment"); };
    });
    document.querySelectorAll("[data-quick-return]").forEach(function(elm){
      elm.onclick = function(){
        var assetId = elm.getAttribute("data-quick-return");
        var act = activeAssignmentFor(assetId);
        if(act) checkInAssignment(act.id);
      };
    });
    document.querySelectorAll("[data-set-status]").forEach(function(elm){
      elm.onclick = function(){
        var parts = elm.getAttribute("data-set-status").split("|");
        setAssetStatus(parts[0], parts[1]);
      };
    });
    document.querySelectorAll("[data-delete-asset]").forEach(function(elm){
      elm.onclick = function(){
        var assetId = elm.getAttribute("data-delete-asset");
        var a = getAsset(assetId);
        openModal("confirm", {title:"Delete Asset", message:"Delete "+(a?escapeHtml(a.name):"this asset")+" permanently? This removes its assignment and maintenance history too. This can't be undone.", confirmLabel:"Delete", onConfirm:function(){ deleteAsset(assetId); }});
      };
    });
    var confirmYes = document.getElementById("confirm-yes");
    if(confirmYes) confirmYes.onclick = function(){ var fn = ui.modal.onConfirm; closeModal(); if(fn) fn(); };

    ["f-status","f-category","f-location"].forEach(function(id){
      var elm = document.getElementById(id);
      if(elm) elm.onchange = function(){
        var key = id.replace("f-","");
        ui.assetFilters[key] = elm.value; render();
      };
    });
    var clearBtn = document.getElementById("clear-filters");
    if(clearBtn) clearBtn.onclick = function(){ ui.assetFilters={status:"",category:"",location:""}; render(); };

    document.querySelectorAll("[data-rtab]").forEach(function(elm){
      elm.onclick = function(){ ui.reportsTab = elm.getAttribute("data-rtab"); render(); };
    });
    var exportBtn = document.getElementById("export-csv");
    if(exportBtn) exportBtn.onclick = exportCsv;

    var addCat = document.getElementById("add-cat");
    if(addCat) addCat.onclick = function(){
      var input = document.getElementById("new-cat-name");
      var v = input.value.trim();
      if(!v) return;
      state.categories.push({id:uid("cat"), name:v});
      toast("Category added."); saveState(); render();
    };
    var addLoc = document.getElementById("add-loc");
    if(addLoc) addLoc.onclick = function(){
      var input = document.getElementById("new-loc-name");
      var v = input.value.trim();
      if(!v) return;
      state.locations.push({id:uid("loc"), name:v});
      toast("Location added."); saveState(); render();
    };
    document.querySelectorAll("[data-del-category]").forEach(function(elm){
      elm.onclick = function(){
        var id = elm.getAttribute("data-del-category");
        var used = state.assets.some(function(a){ var c=state.categories.find(function(x){return x.id===id;}); return c && a.category===c.name; });
        if(used){ toast("Can't delete a category that's in use.", true); return; }
        state.categories = state.categories.filter(function(c){return c.id!==id;});
        saveState(); render();
      };
    });
    document.querySelectorAll("[data-del-location]").forEach(function(elm){
      elm.onclick = function(){
        var id = elm.getAttribute("data-del-location");
        var used = state.assets.some(function(a){ var l=state.locations.find(function(x){return x.id===id;}); return l && a.location===l.name; });
        if(used){ toast("Can't delete a location that's in use.", true); return; }
        state.locations = state.locations.filter(function(l){return l.id!==id;});
        saveState(); render();
      };
    });
  }

  /* ---------------- Boot ---------------- */
  loadState().then(function(){ render(); }).catch(function(e){
    console.error(e);
    state = seedData();
    render();
  });
})();
</script>
